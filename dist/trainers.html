<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="css/palette.css"><script src="js/palette.js"></script><script defer src="js/ui/fluent-emoji-data.js"></script><script defer src="js/ui/fluent-emoji.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>모험가 선택 · 트레이너 목업</title>
<link rel="stylesheet" href="css/fonts.css"><link rel="stylesheet" href="css/trainers/screen.css"><link rel="stylesheet" href="css/trainers/roster.css">
<script defer src="js/trainers/catalog.js"></script><script defer src="js/trainers/sprite.js"></script><script defer src="js/trainers/held-weapon.js"></script><script defer src="js/trainers/app.js"></script>
</head><body><main class="trainer-screen">
<header class="screen-header"><h1>모험가 선택</h1><span>어떤 모습으로 떠날까?</span><a href="craft.html">공방으로</a></header>
<section class="trainer-stage" aria-labelledby="trainer-name">
  <div class="stage-caption"><span>TRAINER SELECT</span><span id="trainer-number">01 / 06</span></div>
  <div class="trainer-display"><div class="trainer-shadow" aria-hidden="true"></div><canvas id="hero-sprite" width="40" height="48" aria-label="선택한 도트 트레이너"></canvas><canvas id="held-weapon" width="120" height="120" aria-label="손에 든 낙서 무기"></canvas></div>
  <div class="identity"><span id="trainer-tag"></span><h2 id="trainer-name"></h2><p id="trainer-look"></p><button id="toggle-weapon" type="button" aria-pressed="true">무기 내려놓기</button></div>
  <p id="weapon-note" class="weapon-note">직접 그린 무기를 손에 들어보세요.</p>
</section>
<section class="roster-section" aria-label="트레이너 여섯 명"><div id="trainer-roster" class="trainer-roster" role="group" aria-label="트레이너 선택"></div></section>
<section class="trainer-console"><div class="trainer-dialogue pixel-panel"><span>모험의 시작</span><p id="trainer-dialogue" aria-live="polite">함께 모험할 트레이너를 골라봐.<br>네가 그린 무기를 직접 들고 싸우게 될 거야.</p></div><div class="selection-actions pixel-panel"><button id="confirm-trainer" type="button"><span class="fluent-emoji" aria-hidden="true">✅</span> 이 트레이너 선택</button><span id="selection-status" role="status">선택 목업 · 전투 적용 전</span></div></section>
<footer>방향키로 선택 · 트레이너마다 외형만 달라요. 능력치는 같아요.</footer>
</main></body></html>
