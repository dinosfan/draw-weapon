<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이딴 게 무기? · 전시 체험</title>
  <script>
    const exhibitParams = new URLSearchParams(location.search);
    const legacyPresentationLink = location.hash === '#presentation=f-ma';
    if (exhibitParams.get('screen') !== 'workshop' || legacyPresentationLink) {
      const presentation = legacyPresentationLink || exhibitParams.get('presentation') === 'f-ma';
      document.documentElement.hidden = true;
      location.replace('start.html?mode=exhibit' + (presentation ? '&presentation=f-ma' : ''));
    }
  </script>
  <link rel="stylesheet" href="css/palette.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/craft/rarity.css">
  <link rel="stylesheet" href="css/exhibit.css?v=poster">
  <link rel="stylesheet" href="css/types.css">
  <link rel="stylesheet" href="css/exhibit-guide.css?v=showcase-settings">
  <link rel="stylesheet" href="css/exhibit-weapon-codex.css">
  <link rel="stylesheet" href="css/exhibit-feedback.css?v=poster">
  <link rel="stylesheet" href="css/exhibit-demo-picker.css">
  <link rel="stylesheet" href="css/game/audio.css">
  <script defer src="js/game/audio-manifest.js"></script>
  <script defer src="js/game/audio.js"></script>
  <script defer src="js/exhibit/feedback.js?v=poster"></script>
  <script defer src="js/exhibit/notice.js?v=poster-cloud"></script>
  <script defer src="js/palette.js"></script>
  <script defer src="js/ui/fluent-emoji-data.js"></script>
  <script defer src="js/ui/fluent-emoji.js"></script>
  <script defer src="js/weapons/catalog.js"></script>
  <script defer src="js/exhibit/session.js?v=poster-demos"></script>
  <script defer src="js/exhibit/presentation.js?v=poster-demos"></script>
  <script defer src="js/game/http.js"></script>
  <script defer src="js/weapons/types.js"></script>
  <script defer src="js/weapons/rarity.js"></script>
  <script defer src="js/craft/rarity-choice.js"></script>
  <script defer src="js/weapons/tactics.js"></script>
  <script defer src="js/weapons/story.js"></script>
  <script defer src="js/weapons/effect-plan.js"></script>
  <script defer src="js/weapons/conditions.js"></script>
  <script defer src="js/weapons/move-rules.js"></script>
  <script defer src="js/weapons/weapon-rig.js"></script>
  <script defer src="js/weapons/hit-feel.js"></script>
  <script defer src="js/weapons/motion-plan.js"></script>
  <script defer src="js/weapons/ultimate.js"></script>
  <script defer src="js/weapons/moves.js"></script>
  <script defer src="js/drawing/canvas.js?v=exhibit-batch"></script>
  <script defer src="js/craft/analysis.js?v=poster"></script>
  <script defer src="js/craft/rarity-reveal.js"></script>
  <script defer src="js/weapons/artwork.js"></script>
  <script defer src="js/trainers/study-sprite.js"></script>
  <script defer src="js/battle/bosses.js"></script>
  <script defer src="js/battle/journey.js"></script>
  <script defer src="js/exhibit/encounter.js?v=random-boss"></script>
  <script defer src="js/game/scenery.js"></script>
  <script defer src="js/exhibit/resources.js?v=poster-demos"></script>
  <script defer src="js/exhibit/demo-picker.js?v=random-boss"></script>
  <script defer src="js/exhibit/guide.js?v=exhibit-ui"></script>
  <script defer src="js/exhibit/settings.js?v=random-boss"></script>
  <script defer src="js/exhibit/workshop.js?v=poster-cloud"></script>
</head>
<body class="exhibit-page">
  <main class="exhibit-workshop">
    <header class="exhibit-header">
      <h1><button type="button" id="exhibit-settings-trigger">이딴 게 <em>무기?</em></button></h1>
      <div class="exhibit-header-actions">
        <span id="exhibit-mode">전시 체험</span>
        <button type="button" id="exhibit-guide-open" aria-haspopup="dialog">도감 · 안내</button>
      </div>
    </header>
    <section class="exhibit-panel" id="exhibit-drawing" aria-labelledby="exhibit-draw-title">
      <div class="exhibit-location"><h2 id="exhibit-draw-title" tabindex="-1">낙서 공방</h2></div>
      <div class="exhibit-desk">
        <canvas class="exhibit-world" id="exhibit-workshop-art" aria-hidden="true"></canvas>
        <div class="exhibit-desk-intro">
          <p id="exhibit-draw-intro">뭐든 그려 봐.<br><strong>네 낙서가 무기가 돼!</strong></p>
          <canvas id="exhibit-trainer" aria-hidden="true"></canvas>
        </div>
        <div class="exhibit-paper">
          <div class="exhibit-board">
            <canvas id="exhibit-canvas" width="512" height="384" aria-label="무기로 만들 그림을 그리는 작업대"></canvas>
            <span id="exhibit-placeholder" aria-hidden="true"><span class="fluent-emoji">✏️</span> 손가락으로 그려 봐</span>
          </div>
          <div class="exhibit-tools">
            <button type="button" id="exhibit-undo" disabled>되돌리기</button>
            <button type="button" id="exhibit-clear" disabled>지우기</button>
          </div>
        </div>
      </div>
      <div class="exhibit-controls">
        <button class="exhibit-primary" type="button" id="exhibit-create" disabled>무기로 만들기 <span class="fluent-emoji" aria-hidden="true">✨</span></button>
        <table class="exhibit-odds" id="exhibit-odds">
          <caption>랜덤 제작 시 등급별 확률</caption>
          <thead><tr id="exhibit-odds-labels"></tr></thead>
          <tbody><tr id="exhibit-odds-values"></tr></tbody>
        </table>
        <p id="exhibit-analysis-status" class="exhibit-notice" role="status" hidden></p>
        <small id="exhibit-privacy" class="exhibit-notice">실시간 제작에서는 그림이 ChatKHU로 전송돼.</small>
        <button class="exhibit-quiet" type="button" id="exhibit-example">예시 무기로 보스 체험</button>
      </div>
    </section>
    <section class="exhibit-panel" id="exhibit-reveal" aria-labelledby="exhibit-name" hidden>
      <div class="exhibit-location"><span>무기 탄생</span><span id="exhibit-rarity" class="exhibit-rarity-badge" hidden></span><small id="exhibit-result-source"></small></div>
      <div class="exhibit-reveal-stage">
        <canvas class="exhibit-world" id="exhibit-reveal-world" aria-hidden="true"></canvas>
        <div class="exhibit-art-paper">
          <canvas id="exhibit-art" width="192" height="144" aria-label="내가 그린 원본 낙서"></canvas>
        </div>
        <div class="exhibit-weapon-name">
          <h2 id="exhibit-name" tabindex="-1"></h2>
          <span id="exhibit-types" class="exhibit-type"></span>
        </div>
      </div>
      <div class="exhibit-loadout">
        <p id="exhibit-reason"></p>
        <h3>기술 4개</h3>
        <ol id="exhibit-moves" class="exhibit-move-grid" aria-label="만들어진 기술 4개"></ol>
      </div>
      <div class="exhibit-controls">
        <button class="exhibit-primary" type="button" id="exhibit-play">3단계 보스 도전 <span class="fluent-emoji" aria-hidden="true">⚔️</span></button>
        <p id="exhibit-effect-status" class="exhibit-notice" role="status" hidden></p>
        <button class="exhibit-quiet" type="button" id="exhibit-edit">낙서 수정하기</button>
      </div>
    </section>
    <section class="exhibit-panel" id="exhibit-battle" aria-labelledby="exhibit-battle-title" hidden>
      <div class="exhibit-location"><h2 id="exhibit-battle-title" tabindex="-1">3단계 보스</h2><small id="exhibit-phase"></small></div>
      <div class="exhibit-stage" id="exhibit-stage">
        <canvas class="exhibit-world" id="exhibit-world" aria-hidden="true"></canvas>
        <div class="exhibit-enemy-card">
          <strong id="exhibit-boss-name"></strong>
          <div class="exhibit-hp"><span>HP</span><meter id="exhibit-hp" min="0" max="100" value="100" aria-label="상대 체력"></meter></div>
        </div>
        <canvas class="exhibit-enemy" id="exhibit-enemy" width="32" height="32"></canvas>
        <div class="exhibit-player" id="exhibit-player">
          <canvas id="player-sprite" aria-label="도트 모험가"></canvas>
          <canvas class="exhibit-held" id="exhibit-held" width="64" height="64" aria-label="손에 든 원본 낙서"></canvas>
        </div>
        <div class="exhibit-equipped">
          <strong id="exhibit-equipped-name"></strong>
          <div class="exhibit-hp"><span>HP</span><meter id="exhibit-player-hp" min="0" max="100" value="100" aria-label="내 체력"></meter></div>
        </div>
        <canvas class="exhibit-effect" id="exhibit-effect" aria-hidden="true"></canvas>
      </div>
      <div class="exhibit-command-deck">
        <p class="exhibit-log" id="exhibit-log" role="status"></p>
        <div class="exhibit-move-grid" id="exhibit-commands" aria-label="전투 기술 선택"></div>
        <div class="exhibit-result" id="exhibit-result" hidden>
          <h3 id="exhibit-result-title" tabindex="-1"></h3>
          <button class="exhibit-primary" type="button" id="exhibit-again">보스 다시 도전</button>
          <button class="exhibit-quiet" type="button" id="exhibit-new">새 낙서 그리기</button>
        </div>
      </div>
    </section>
    <div class="exhibit-footer-actions" id="exhibit-footer-actions" hidden>
      <button type="button" data-exhibit-feedback aria-haspopup="dialog">오류 제보</button>
    </div>
  </main>
  <dialog class="exhibit-guide exhibit-settings" id="exhibit-settings" aria-labelledby="exhibit-settings-title">
    <header>
      <h2 id="exhibit-settings-title">시연 설정</h2>
      <form method="dialog"><button type="submit">닫기</button></form>
    </header>
    <div class="exhibit-settings-fields">
      <label for="exhibit-settings-rarity">제작 등급</label>
      <select id="exhibit-settings-rarity" aria-describedby="exhibit-settings-hint" autofocus><option value="random">랜덤 (기본)</option></select>
      <p id="exhibit-settings-hint" role="status"></p>
      <label for="exhibit-settings-boss">3단계 보스</label>
      <select id="exhibit-settings-boss"></select>
    </div>
  </dialog>
  <dialog class="exhibit-guide" id="exhibit-guide" aria-labelledby="exhibit-guide-title">
    <header>
      <h2 id="exhibit-guide-title">낙서 탐험 수첩</h2>
      <form method="dialog"><button type="submit" autofocus>닫기</button></form>
    </header>
    <nav class="guide-options" aria-label="수첩 메뉴">
      <button type="button" data-guide-section="enemies">적 도감</button>
      <button type="button" data-guide-section="weapons">무기 도감</button>
      <button type="button" data-guide-section="rules">상성 · 상태</button>
      <button type="button" data-guide-section="rarity">등급</button>
      <button type="button" data-guide-section="adventure">게임 안내</button>
    </nav>
    <div id="exhibit-guide-content" class="exhibit-guide-content"></div>
    <p id="exhibit-guide-status" class="exhibit-guide-status" role="status" hidden></p>
  </dialog>
</body>
</html>
